<div style="width: 820px; height: 500px; box-sizing: border-box; background: #D9D9DE; font-family: 'Bricolage Grotesque', sans-serif; color: #151518; position: relative; overflow: hidden">

<div style="display: flex; flex-direction: column; width: 220px">
<div style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">[A synth]</div>
<div style="font-size: 13px; color: #9494A0; margin-top: 2px">Filter, sweeping closed</div>
<div style="flex-grow: 1"></div>
<div style="padding-bottom: 76px"><div style="font-size: 12px; color: #9494A0">Out</div><div style="font-size: 30px; font-weight: 500; letter-spacing: -0.03em">-9<span style="font-size: 13px; color: #9494A0; letter-spacing: 0"> dB</span></div></div>
</div>
<svg role="img" aria-label="The filter's response, with its cutoff lit" viewBox="0 0 470 200" style="flex-grow: 1; height: 178px">
<path d="M0 150h470" stroke="#2A2A30" stroke-width="1"/>
<path d="M0 70H210C250 70 262 30 280 30S306 90 330 150 380 196 470 198" fill="none" stroke="#F4F4F6" stroke-width="1.75" stroke-linecap="round"/>
<path d="M250 52C262 36 270 30 280 30S296 50 306 80" fill="none" stroke="#B3A1FF" stroke-width="5" stroke-linecap="round"/>

</div>
<div style="position: absolute; left: 44px; top: 232px; width: 732px; height: 248px; box-sizing: border-box; border-radius: 26px; background: #F6F6F8; padding: 18px 26px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 30px -12px rgba(0,0,0,0.45), 0 18px 30px -18px rgba(20,20,40,0.4)">
<div style="display: flex; align-items: flex-end; gap: 18px">
<button style="flex-grow: 1; padding: 0 0 8px; border: 0; border-bottom: 3px solid #DADAE0; background: transparent; color: #5B5B66; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 60px; justify-content: flex-end">
<span style="display: flex; gap: 4px; align-items: flex-end; height: 24px"><span style="width: 8px; height: 50%; border-radius: 2px; background: #B9B9C2"></span><span style="width: 8px; height: 100%; border-radius: 2px; background: #B9B9C2"></span><span style="width: 8px; height: 20%; border-radius: 2px; background: #B9B9C2"></span><span style="width: 8px; height: 35%; border-radius: 2px; background: #B9B9C2"></span></span>

<button style="flex-grow: 1; padding: 0 0 8px; border: 0; border-bottom: 3px solid #151518; background: transparent; color: #151518; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 60px; justify-content: flex-end">
<span style="display: flex; gap: 4px; align-items: flex-end; height: 24px"><span style="width: 8px; height: 58%; border-radius: 2px; background: #6142D6"></span><span style="width: 8px; height: 35%; border-radius: 2px; background: #151518"></span><span style="width: 8px; height: 80%; border-radius: 2px; background: #151518"></span><span style="width: 8px; height: 50%; border-radius: 2px; background: #151518"></span></span>

<button style="flex-grow: 1; padding: 0 0 8px; border: 0; border-bottom: 3px solid #DADAE0; background: transparent; color: #5B5B66; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 60px; justify-content: flex-end">
<span style="display: flex; gap: 4px; align-items: flex-end; height: 24px"><span style="width: 8px; height: 10%; border-radius: 2px; background: #B9B9C2"></span><span style="width: 8px; height: 45%; border-radius: 2px; background: #B9B9C2"></span><span style="width: 8px; height: 70%; border-radius: 2px; background: #B9B9C2"></span><span style="width: 8px; height: 60%; border-radius: 2px; background: #B9B9C2"></span></span>
<span style="font-size: 14px; font-weight: 500">Envelope</span>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; flex-grow: 1">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 12px">
<div style="font-size: 13px; color: #6142D6; font-weight: 600">Cutoff</div>
<div style="font-size: 44px; font-weight: 500; letter-spacing: -0.04em; color: #6142D6; line-height: 1">2.4<span style="font-size: 14px; letter-spacing: 0"> kHz</span></div>
<div style="height: 3px; border-radius: 2px; background: #DADAE0"><div style="width: 58%; height: 3px; border-radius: 2px; background: #6142D6"></div></div>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 12px">
<div style="font-size: 13px; color: #5B5B66">Resonance</div>
<div style="font-size: 44px; font-weight: 500; letter-spacing: -0.04em; line-height: 1">35<span style="font-size: 14px; letter-spacing: 0; color: #5B5B66"> %</span></div>
<div style="height: 3px; border-radius: 2px; background: #DADAE0"><div style="width: 35%; height: 3px; border-radius: 2px; background: #151518"></div></div>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 12px">
<div style="font-size: 13px; color: #5B5B66">Envelope amount</div>
<div style="font-size: 44px; font-weight: 500; letter-spacing: -0.04em; line-height: 1">+3.2<span style="font-size: 14px; letter-spacing: 0; color: #5B5B66"> oct</span></div>
<div style="position: relative; height: 3px; border-radius: 2px; background: #DADAE0"><div style="position: absolute; left: 50%; width: 30%; height: 3px; border-radius: 2px; background: #151518"></div></div>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 12px">
<div style="font-size: 13px; color: #5B5B66">Key follow</div>
<div style="font-size: 44px; font-weight: 500; letter-spacing: -0.04em; line-height: 1">50<span style="font-size: 14px; letter-spacing: 0; color: #5B5B66"> %</span></div>
<div style="height: 3px; border-radius: 2px; background: #DADAE0"><div style="width: 50%; height: 3px; border-radius: 2px; background: #151518"></div></div>
</div>
</div>
</div>
</div>
