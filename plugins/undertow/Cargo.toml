[package]
name = "undertow"
version = "0.4.0"
description = "The middle's low end biases the sides' valve, sample by sample"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Named after the plugin: cargo puts every package's examples in one
# folder, so a second plugin's `spec` would overwrite this one's.
[[example]]
name = "undertow-spec"
path = "examples/spec.rs"

[[example]]
name = "undertow-demo"
path = "examples/demo.rs"

[dependencies]
kit = { workspace = true }
kit-dsp = { workspace = true }
kit-vst3 = { workspace = true }
kit-clap = { workspace = true }
kit-webui = { workspace = true }

[dev-dependencies]
kit-test = { workspace = true }
