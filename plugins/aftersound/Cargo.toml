[package]
name = "aftersound"
version = "0.2.1"
description = "Two coupled strings a note, one in each channel: the prompt sound in the middle, the aftersound in the sides"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Named after the plugin: cargo puts every package's examples in one
# folder, so a second plugin's `spec` would overwrite this one's.
[[example]]
name = "aftersound-spec"
path = "examples/spec.rs"

[[example]]
name = "aftersound-demo"
path = "examples/demo.rs"

[dependencies]
kit = { workspace = true }
kit-dsp = { workspace = true }
kit-vst3 = { workspace = true }
kit-clap = { workspace = true }
kit-webui = { workspace = true }

[dev-dependencies]
kit-test = { workspace = true }
