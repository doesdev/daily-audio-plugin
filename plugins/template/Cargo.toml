[package]
name = "template"
version = "0.1.0"
description = "Drive, tone and mix: the plugin every new one starts as"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Not shipped: it exists to be copied by `npm run new` and to prove the
# kit end to end.
[package.metadata.kit]
release = false

[lib]
crate-type = ["cdylib", "rlib"]

# Named after the plugin: cargo puts every package's examples in one
# folder, so a second plugin's `spec` would overwrite this one's.
[[example]]
name = "template-spec"
path = "examples/spec.rs"

[[example]]
name = "template-demo"
path = "examples/demo.rs"

[dependencies]
kit = { workspace = true }
kit-dsp = { workspace = true }
kit-vst3 = { workspace = true }
kit-clap = { workspace = true }
kit-webui = { workspace = true }

[dev-dependencies]
kit-test = { workspace = true }
